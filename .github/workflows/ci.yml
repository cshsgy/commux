name: Continuous Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Cancel an in-progress run when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  BUILD_TYPE: Release

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install style checkers
        run: pip install --user cpplint cppcheck clang-format==20.1.4

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # commux is Linux-only (UCX does not build on macOS), so CI is Linux-only.
  # CI uses the system UCX (apt) to skip the ~20-min source build; the release
  # workflow bundles UCX from source for self-contained wheels.
  build-and-test:
    needs: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for setuptools-scm version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install system UCX (fast path; release bundles it instead)
        run: |
          sudo apt-get update
          sudo apt-get install -y libucx-dev pkg-config

      - name: Install Python dependencies
        run: |
          pip install scikit-build-core ninja cmake setuptools-scm wheel numpy patchelf
          pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu

      - name: Configure CMake (C++ tests)
        run: |
          cmake -B ${{ github.workspace }}/build \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
                -DCOMMUX_UCX_PROVIDER=system \
                -DCOMMUX_CUDA=OFF \
                -DCOMMUX_BUILD_TESTS=ON

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Install the project (python module)
        run: |
          pip install --no-build-isolation --no-deps \
            -C cmake.define.COMMUX_UCX_PROVIDER=system \
            -C cmake.define.COMMUX_CUDA=OFF .

      - name: Smoke import + end-to-end backend tests (CPU, 2-4 ranks)
        env:
          UCX_TLS: tcp,sm,self
        run: |
          python -c "import commux; commux.register(); print('commux import OK')"
          torchrun --standalone --nnodes=1 --nproc-per-node=2 tests/test_torch_dist.py
          for n in 3 4 5 6 7; do torchrun --standalone --nnodes=1 --nproc-per-node=$n tests/test_collectives.py; done
          for n in 3 4; do timeout 120 torchrun --standalone --nnodes=1 --nproc-per-node=$n tests/test_reduce_op.py; done

      - name: C++ test (2 ranks over TCPStore)
        env:
          UCX_TLS: tcp,sm,self
        run: |
          # COMMUX_MT runs the concurrent multi-threaded send/recv test;
          # COMMUX_DEADLOCK runs the lost-wakeup regression test (many threads
          # parked on the shared worker must all wake). Both are 2-rank.
          export COMMUX_MT=1 COMMUX_DEADLOCK=1
          ./build/test_commux 1 2 127.0.0.1 29555 &
          ./build/test_commux 0 2 127.0.0.1 29555
          wait

      - name: C++ late-poll regression (2 ranks, spin budget set)
        env:
          UCX_TLS: tcp,sm,self
        run: |
          # A wait past COMMUX_SPIN_US must not pay another COMMUX_WAIT_POLL_MS
          # after the request has already completed. Poll is 20 ms so one extra
          # park is larger than localhost noise. Rank 0's status is the check.
          export COMMUX_SPIN_US=1000 COMMUX_WAIT_POLL_MS=20 COMMUX_LATE=1
          # A rank crash must not hang until the job limit.
          timeout 300 ./build/test_commux 1 2 127.0.0.1 29556 &
          pid=$!
          set +e
          timeout 300 ./build/test_commux 0 2 127.0.0.1 29556
          status0=$?
          wait "$pid"
          status1=$?
          set -e
          test "$status0" -eq 0 -a "$status1" -eq 0

      - name: C++ flood park on TCP only (spin budget set)
        env:
          UCX_TLS: tcp
        run: |
          # Same park check as the shared-memory flood. On 4045268 a TCP-only
          # worker spun here (poll returned immediately, arm never BUSY).
          export COMMUX_SPIN_US=1000 COMMUX_WAIT_POLL_MS=20 COMMUX_LATE=1
          timeout 300 taskset -c 0,1 ./build/test_commux 1 2 127.0.0.1 29560 &
          pid=$!
          set +e
          timeout 300 taskset -c 0,1 ./build/test_commux 0 2 127.0.0.1 29560
          status0=$?
          wait "$pid"
          status1=$?
          set -e
          test "$status0" -eq 0 -a "$status1" -eq 0

      - name: C++ multi-request wait (2 ranks, grouping on)
        env:
          UCX_TLS: tcp,sm,self
        run: |
          # Two ucp requests in one Work, second message 1 ms later.
          # COMMUX_COALESCE stays off, so this is not an IOV.
          export COMMUX_SPIN_US=1000 COMMUX_WAIT_POLL_MS=20 COMMUX_LATE=1
          export COMMUX_GROUP=1
          timeout 300 taskset -c 0,1 ./build/test_commux 1 2 127.0.0.1 29561 &
          pid=$!
          set +e
          timeout 300 taskset -c 0,1 ./build/test_commux 0 2 127.0.0.1 29561
          status0=$?
          wait "$pid"
          status1=$?
          set -e
          test "$status0" -eq 0 -a "$status1" -eq 0

      - name: C++ multi-request wait (3 ranks, two peers)
        env:
          UCX_TLS: tcp,sm,self
        run: |
          export COMMUX_SPIN_US=1000 COMMUX_WAIT_POLL_MS=20 COMMUX_LATE=1
          export COMMUX_GROUP=1
          timeout 300 taskset -c 0,1 ./build/test_commux 1 3 127.0.0.1 29562 &
          pid1=$!
          timeout 300 taskset -c 0,1 ./build/test_commux 2 3 127.0.0.1 29562 &
          pid2=$!
          set +e
          timeout 300 taskset -c 0,1 ./build/test_commux 0 3 127.0.0.1 29562
          status0=$?
          wait "$pid1"
          status1=$?
          wait "$pid2"
          status2=$?
          set -e
          test "$status0" -eq 0 -a "$status1" -eq 0 -a "$status2" -eq 0
